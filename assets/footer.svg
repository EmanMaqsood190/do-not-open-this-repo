<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Geneva, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="tape" width="40" height="40" patternTransform="rotate(-8)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f2d13a"/>
      <rect width="20" height="40" fill="#1a1a1a"/>
    </pattern>
  </defs>

  <rect width="1200" height="140" fill="#150a1e"/>

  <!-- torn caution tape strips -->
  <rect x="0" y="10" width="1200" height="28" fill="url(#tape)"/>
  <rect x="0" y="102" width="1200" height="28" fill="url(#tape)"/>

  <!-- small zombie eyeball peeking from center -->
  <g transform="translate(600,70)">
    <circle r="34" fill="#2a1435" stroke="#c93a3a" stroke-width="4"/>
    <circle r="16" fill="#f4f1c9"/>
    <circle r="8" fill="#3f7a34"/>
    <circle r="3.5" fill="#1a1a1a"/>
    <path d="M-30 -18 q30 -20 60 0" fill="none" stroke="#c93a3a" stroke-width="4" stroke-linecap="round"/>
    <path d="M-30 18 q30 20 60 0" fill="none" stroke="#c93a3a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="380" y="76" text-anchor="end" font-size="22" fill="#f4f1c9" font-weight="bold" letter-spacing="1">
    STILL SCROLLING?
  </text>
  <text x="820" y="76" text-anchor="start" font-size="22" fill="#f4f1c9" font-weight="bold" letter-spacing="1">
    THAT'S ON YOU.
  </text>
</svg>
