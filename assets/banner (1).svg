<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Geneva, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b0f28"/>
      <stop offset="60%" stop-color="#2a1435"/>
      <stop offset="100%" stop-color="#3b1f1f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcd6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eafcd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="crackle">
      <feTurbulence baseFrequency="0.9" numOctaves="1" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- moon -->
  <circle cx="1080" cy="60" r="70" fill="url(#moonGlow)"/>
  <circle cx="1080" cy="60" r="34" fill="#f4f1c9"/>
  <circle cx="1068" cy="50" r="5" fill="#d8d39a"/>
  <circle cx="1094" cy="70" r="7" fill="#d8d39a"/>

  <!-- ground fog -->
  <ellipse cx="600" cy="290" rx="700" ry="30" fill="#4c2b52" opacity="0.5"/>

  <!-- tombstones -->
  <g fill="#3a2540" stroke="#5c3a63" stroke-width="2">
    <path d="M60 260 v-50 a20 20 0 0 1 40 0 v50 z"/>
    <path d="M980 265 v-40 a16 16 0 0 1 32 0 v40 z"/>
  </g>

  <!-- ===================== ZOMBIE CARROT ===================== -->
  <g transform="translate(150,150)">
    <path d="M-40 40 L40 40 L15 130 L-15 130 Z" fill="#e8792c" stroke="#b85a1a" stroke-width="4"/>
    <path d="M-40 40 L40 40 L30 70 L-30 70 Z" fill="#f28d3f"/>
    <path d="M-10 40 l-4 90 M10 40 l4 90 M0 40 l0 90" stroke="#c2661f" stroke-width="2" opacity="0.6"/>
    <!-- leaves -->
    <path d="M-10 40 C-30 0 -20 -30 -35 -55 C-15 -40 -5 -20 0 0 Z" fill="#4c8c3f"/>
    <path d="M10 40 C30 0 20 -30 35 -55 C15 -40 5 -20 0 0 Z" fill="#3f7a34"/>
    <path d="M0 40 C0 0 0 -35 0 -60 C-6 -40 -3 -20 0 0 Z" fill="#5a9e4a"/>
    <!-- face -->
    <ellipse cx="-14" cy="55" rx="8" ry="6" fill="#fff"/>
    <circle cx="-12" cy="56" r="3" fill="#1a1a1a"/>
    <ellipse cx="14" cy="55" rx="8" ry="6" fill="#fff"/>
    <circle cx="12" cy="58" r="3" fill="#1a1a1a"/>
    <path d="M-20 45 l14 6 M20 45 l-14 6" stroke="#7a3d10" stroke-width="3" stroke-linecap="round"/>
    <path d="M-14 78 q14 14 28 0" fill="none" stroke="#7a3d10" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 82 l-3 8 M0 84 l0 8 M10 82 l3 8" stroke="#7a3d10" stroke-width="2"/>
    <path d="M-25 60 q-8 4 -6 12" stroke="#7a3d10" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===================== ZOMBIE TOMATO ===================== -->
  <g transform="translate(420,175)">
    <circle cx="0" cy="0" r="55" fill="#c93a3a" stroke="#8f2323" stroke-width="4"/>
    <circle cx="-18" cy="-15" r="14" fill="#e46060" opacity="0.6"/>
    <path d="M-14 -50 q14 -18 28 0 q6 -14 20 -10 q-6 14 -20 16 q-14 8 -28 -6 q-14 8 -20 -6 q14 -8 20 6 Z" fill="#3f7a34"/>
    <!-- stitched crack -->
    <path d="M-30 -10 q10 10 -4 22 q14 4 6 18" fill="none" stroke="#4a0f0f" stroke-width="3"/>
    <path d="M-27 -6 l6 4 M-24 4 l6 -2 M-21 14 l6 4 M-18 24 l6 -2" stroke="#e8b8b8" stroke-width="2"/>
    <!-- face -->
    <ellipse cx="10" cy="-5" rx="9" ry="7" fill="#fff"/>
    <circle cx="13" cy="-3" r="3.5" fill="#1a1a1a"/>
    <ellipse cx="32" cy="0" rx="7" ry="9" fill="#fff"/>
    <circle cx="34" cy="2" r="3" fill="#1a1a1a"/>
    <path d="M5 20 q18 14 32 -2" fill="none" stroke="#4a0f0f" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 24 l-2 7 M20 26 l0 7 M30 22 l2 7" stroke="#4a0f0f" stroke-width="2"/>
  </g>

  <!-- ===================== ZOMBIE BROCCOLI WARLORD ===================== -->
  <g transform="translate(700,140)">
    <path d="M-45 -20 q-15 -30 10 -45 q5 -20 30 -15 q15 -20 35 0 q25 -5 30 15 q25 15 10 45 q10 20 -10 35 q-5 15 -25 12 l0 20 l-45 0 l0 -20 q-20 3 -25 -12 q-20 -15 -10 -35 Z" fill="#3f7a34" stroke="#255222" stroke-width="4"/>
    <circle cx="-20" cy="-25" r="10" fill="#4f8c40" opacity="0.7"/>
    <circle cx="15" cy="-35" r="8" fill="#4f8c40" opacity="0.7"/>
    <circle cx="35" cy="-10" r="9" fill="#4f8c40" opacity="0.7"/>
    <rect x="-10" y="27" width="20" height="30" fill="#c9a86a" stroke="#8a6d3f" stroke-width="3"/>
    <!-- eye patch + angry eye -->
    <path d="M-30 -15 l24 4 l-2 14 l-24 -4 Z" fill="#1a1a1a"/>
    <path d="M-32 -13 l-14 -6 M-6 -25 l14 -4" stroke="#1a1a1a" stroke-width="3"/>
    <ellipse cx="22" cy="-8" rx="9" ry="7" fill="#fff"/>
    <circle cx="25" cy="-6" r="3.5" fill="#e8342a"/>
    <path d="M12 -20 l20 -6" stroke="#255222" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15 12 q20 10 40 -4" fill="none" stroke="#255222" stroke-width="3" stroke-linecap="round"/>
    <!-- tiny crown because warlord -->
    <path d="M-8 -55 l4 -14 l8 10 l8 -16 l8 16 l8 -10 l4 14 Z" fill="#e8c243" stroke="#a8842a" stroke-width="2"/>
  </g>

  <!-- ===================== ZOMBIE CORN ===================== -->
  <g transform="translate(950,160)">
    <path d="M-25 -60 C-45 -40 -45 40 -25 65 C-5 85 20 85 25 65 C40 40 40 -40 20 -60 C5 -75 -10 -75 -25 -60 Z" fill="#f2d13a" stroke="#b89a1c" stroke-width="4"/>
    <g fill="#d8b820">
      <circle cx="-15" cy="-40" r="4"/><circle cx="0" cy="-45" r="4"/><circle cx="15" cy="-38" r="4"/>
      <circle cx="-18" cy="-25" r="4"/><circle cx="-2" cy="-28" r="4"/><circle cx="14" cy="-24" r="4"/>
      <circle cx="-18" cy="-8" r="4"/><circle cx="0" cy="-10" r="4"/><circle cx="16" cy="-6" r="4"/>
      <circle cx="-16" cy="10" r="4"/><circle cx="0" cy="8" r="4"/><circle cx="15" cy="12" r="4"/>
      <circle cx="-12" cy="28" r="4"/><circle cx="2" cy="26" r="4"/><circle cx="13" cy="30" r="4"/>
      <circle cx="-8" cy="45" r="4"/><circle cx="4" cy="44" r="4"/><circle cx="12" cy="48" r="4"/>
    </g>
    <path d="M-10 -60 q-20 -20 -30 -15 q5 20 20 25 Z" fill="#6fae4c"/>
    <path d="M10 -60 q20 -20 30 -15 q-5 20 -20 25 Z" fill="#5a9a3c"/>
    <!-- face -->
    <ellipse cx="-10" cy="20" rx="7" ry="9" fill="#fff"/>
    <circle cx="-12" cy="22" r="3" fill="#1a1a1a"/>
    <ellipse cx="12" cy="18" rx="8" ry="6" fill="#fff"/>
    <circle cx="14" cy="16" r="3" fill="#1a1a1a"/>
    <path d="M-15 40 q14 12 28 0" fill="none" stroke="#8a6d1c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- creepy crawling hand -->
  <g transform="translate(300,255)" stroke="#3f7a34" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M0 40 L0 0"/>
    <path d="M0 0 L-8 -18"/>
    <path d="M0 0 L0 -20"/>
    <path d="M0 0 L8 -18"/>
    <path d="M0 0 L14 -10"/>
  </g>

  <!-- big warning text -->
  <text x="600" y="285" text-anchor="middle" font-size="20" fill="#f2d13a" font-weight="bold" letter-spacing="2">
    ⚠ DO NOT OPEN THIS REPO ⚠
  </text>
  <text x="600" y="55" text-anchor="middle" font-size="46" fill="#f4f1c9" font-weight="bold" letter-spacing="3" stroke="#8f2323" stroke-width="1">
    ATTACK OF THE ZOMBIE VEGETABLES
  </text>
  <text x="600" y="85" text-anchor="middle" font-size="16" fill="#c9a8d0" letter-spacing="1">
    you clicked anyway. of course you did.
  </text>
</svg>
