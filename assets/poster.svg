<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Verdana, Geneva, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <!-- APPLE -->
    <g id="apple">
      <circle cx="30" cy="35" r="18" fill="#e6432c" stroke="#a82c1a" stroke-width="2"/>
      <path d="M30 17 q-2 -8 4 -10" fill="none" stroke="#7a4a1e" stroke-width="3" stroke-linecap="round"/>
      <path d="M30 15 q10 -6 14 2 q-8 2 -14 -2 Z" fill="#4c8c3f"/>
    </g>

    <!-- BANANA -->
    <g id="banana">
      <path d="M14 44 C10 20 26 10 42 14 C40 18 26 20 24 34 C22 42 20 46 14 44 Z" fill="#f2d13a" stroke="#b89a1c" stroke-width="2"/>
      <path d="M40 13 l4 -4" stroke="#7a5c14" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- CARROT -->
    <g id="carrot">
      <path d="M22 20 L38 20 L30 48 Z" fill="#e8792c" stroke="#b85a1a" stroke-width="2"/>
      <path d="M30 20 C28 8 24 4 18 2 C22 10 24 14 26 20 Z" fill="#4c8c3f"/>
      <path d="M30 20 C30 6 30 2 30 0 C31 8 31 14 32 20 Z" fill="#5a9e4a"/>
      <path d="M30 20 C32 8 36 4 42 2 C38 10 36 14 34 20 Z" fill="#3f7a34"/>
    </g>

    <!-- TOMATO -->
    <g id="tomato">
      <circle cx="30" cy="34" r="17" fill="#c93a3a" stroke="#8f2323" stroke-width="2"/>
      <path d="M18 20 q6 -8 12 0 q3 -6 9 -4 q-2 6 -9 7 q-6 4 -12 -3 q-6 3 -9 -3 q6 -4 9 3 Z" fill="#3f7a34"/>
    </g>

    <!-- BROCCOLI -->
    <g id="broccoli">
      <path d="M14 26 q-6 -12 4 -18 q2 -8 12 -6 q6 -8 14 0 q10 -2 12 6 q10 6 4 18 q4 8 -4 14 l0 6 l-16 0 l0 -6 q-8 -6 -4 -14 Z" fill="#3f7a34" stroke="#255222" stroke-width="2"/>
      <circle cx="20" cy="16" r="4" fill="#4f8c40" opacity="0.6"/>
      <circle cx="38" cy="14" r="4" fill="#4f8c40" opacity="0.6"/>
      <rect x="24" y="46" width="12" height="10" fill="#c9a86a"/>
    </g>

    <!-- CORN -->
    <g id="corn">
      <path d="M22 10 C10 20 10 44 22 52 C30 58 34 52 36 46 C42 34 40 16 30 8 C27 6 24 7 22 10 Z" fill="#f2d13a" stroke="#b89a1c" stroke-width="2"/>
      <g fill="#d8b820">
        <circle cx="22" cy="18" r="2.4"/><circle cx="30" cy="16" r="2.4"/>
        <circle cx="20" cy="26" r="2.4"/><circle cx="29" cy="25" r="2.4"/>
        <circle cx="20" cy="34" r="2.4"/><circle cx="30" cy="34" r="2.4"/>
        <circle cx="22" cy="42" r="2.4"/><circle cx="31" cy="42" r="2.4"/>
      </g>
      <path d="M20 12 q-8 -6 -14 -2 q4 8 14 10 Z" fill="#5a9a3c"/>
    </g>

    <!-- CAT FACE -->
    <g id="cat">
      <path d="M14 20 L22 6 L28 18 Z" fill="#e8a15a"/>
      <path d="M46 20 L38 6 L32 18 Z" fill="#e8a15a"/>
      <circle cx="30" cy="30" r="20" fill="#f2b76e" stroke="#c8823a" stroke-width="2"/>
      <circle cx="22" cy="27" r="3" fill="#1a1a1a"/>
      <circle cx="38" cy="27" r="3" fill="#1a1a1a"/>
      <path d="M30 33 l-3 4 l6 0 Z" fill="#c8823a"/>
      <path d="M30 37 q-4 4 -8 2 M30 37 q4 4 8 2" stroke="#8a5a24" stroke-width="1.5" fill="none"/>
      <path d="M8 26 l10 2 M8 34 l10 -1 M52 26 l-10 2 M52 34 l-10 -1" stroke="#8a5a24" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- DOG FACE -->
    <g id="dog">
      <path d="M10 18 q-6 10 2 20 l6 -8 Z" fill="#a8763f"/>
      <path d="M50 18 q6 10 -2 20 l-6 -8 Z" fill="#a8763f"/>
      <circle cx="30" cy="32" r="19" fill="#d9a563" stroke="#a8763f" stroke-width="2"/>
      <circle cx="23" cy="28" r="3" fill="#1a1a1a"/>
      <circle cx="37" cy="28" r="3" fill="#1a1a1a"/>
      <ellipse cx="30" cy="38" rx="10" ry="8" fill="#f0d3a6"/>
      <ellipse cx="30" cy="35" rx="4" ry="3" fill="#1a1a1a"/>
      <path d="M30 38 q-4 4 -7 3 M30 38 q4 4 7 3" stroke="#8a5a24" stroke-width="1.5" fill="none"/>
    </g>

    <!-- STRAWBERRY (bonus filler) -->
    <g id="strawberry">
      <path d="M30 14 C42 14 46 28 38 44 C34 52 26 52 22 44 C14 28 18 14 30 14 Z" fill="#e6304a" stroke="#a81e34" stroke-width="2"/>
      <path d="M20 16 q10 -10 20 0 q-10 -2 -20 0 Z" fill="#4c8c3f"/>
      <g fill="#f4e0c8">
        <circle cx="24" cy="24" r="1.3"/><circle cx="30" cy="22" r="1.3"/><circle cx="36" cy="24" r="1.3"/>
        <circle cx="22" cy="32" r="1.3"/><circle cx="30" cy="30" r="1.3"/><circle cx="38" cy="32" r="1.3"/>
        <circle cx="26" cy="40" r="1.3"/><circle cx="34" cy="40" r="1.3"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="1000" height="1000" fill="#150a1e"/>
  <rect x="6" y="6" width="988" height="988" fill="none" stroke="#f2d13a" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- ============ BORDER ICONS - TOP ROW ============ -->
  <g>
    <use href="#apple" xlink:href="#apple" x="30" y="20" transform="rotate(-8 60 50)"/>
    <use href="#carrot" xlink:href="#carrot" x="130" y="18"/>
    <use href="#cat" xlink:href="#cat" x="230" y="15" transform="rotate(5 260 45)"/>
    <use href="#banana" xlink:href="#banana" x="330" y="22"/>
    <use href="#tomato" xlink:href="#tomato" x="430" y="15"/>
    <use href="#dog" xlink:href="#dog" x="530" y="15" transform="rotate(-4 560 45)"/>
    <use href="#broccoli" xlink:href="#broccoli" x="630" y="15"/>
    <use href="#strawberry" xlink:href="#strawberry" x="730" y="18"/>
    <use href="#corn" xlink:href="#corn" x="828" y="12"/>
    <use href="#apple" xlink:href="#apple" x="920" y="20" transform="rotate(10 950 50)"/>
  </g>

  <!-- ============ BORDER ICONS - BOTTOM ROW ============ -->
  <g>
    <use href="#dog" xlink:href="#dog" x="30" y="930"/>
    <use href="#tomato" xlink:href="#tomato" x="130" y="936"/>
    <use href="#corn" xlink:href="#corn" x="228" y="922"/>
    <use href="#cat" xlink:href="#cat" x="330" y="930" transform="rotate(-6 360 960)"/>
    <use href="#strawberry" xlink:href="#strawberry" x="430" y="928"/>
    <use href="#carrot" xlink:href="#carrot" x="530" y="928"/>
    <use href="#banana" xlink:href="#banana" x="630" y="932"/>
    <use href="#broccoli" xlink:href="#broccoli" x="730" y="924"/>
    <use href="#apple" xlink:href="#apple" x="828" y="930" transform="rotate(6 858 960)"/>
    <use href="#tomato" xlink:href="#tomato" x="920" y="928"/>
  </g>

  <!-- ============ BORDER ICONS - LEFT COLUMN ============ -->
  <g>
    <use href="#strawberry" xlink:href="#strawberry" x="12" y="130"/>
    <use href="#broccoli" xlink:href="#broccoli" x="10" y="230"/>
    <use href="#banana" xlink:href="#banana" x="14" y="330" transform="rotate(90 44 360)"/>
    <use href="#dog" xlink:href="#dog" x="10" y="430"/>
    <use href="#carrot" xlink:href="#carrot" x="12" y="530" transform="rotate(-15 42 560)"/>
    <use href="#cat" xlink:href="#cat" x="10" y="630"/>
    <use href="#corn" xlink:href="#corn" x="12" y="730"/>
    <use href="#apple" xlink:href="#apple" x="14" y="828"/>
  </g>

  <!-- ============ BORDER ICONS - RIGHT COLUMN ============ -->
  <g>
    <use href="#cat" xlink:href="#cat" x="932" y="130"/>
    <use href="#tomato" xlink:href="#tomato" x="936" y="230"/>
    <use href="#broccoli" xlink:href="#broccoli" x="932" y="330"/>
    <use href="#banana" xlink:href="#banana" x="930" y="430" transform="rotate(-90 960 460)"/>
    <use href="#dog" xlink:href="#dog" x="932" y="530"/>
    <use href="#strawberry" xlink:href="#strawberry" x="936" y="630"/>
    <use href="#carrot" xlink:href="#carrot" x="932" y="730" transform="rotate(15 962 760)"/>
    <use href="#corn" xlink:href="#corn" x="930" y="828"/>
  </g>

  <!-- ============ CENTER RAGEBAIT CHALLENGE ============ -->
  <g text-anchor="middle">
    <text x="500" y="400" font-size="30" fill="#c93a3a" font-weight="bold" letter-spacing="3">⚠ FINAL WARNING ⚠</text>

    <text x="500" y="470" font-size="70" fill="#f4f1c9" font-weight="900" letter-spacing="2">DO NOT</text>
    <text x="500" y="545" font-size="70" fill="#f4f1c9" font-weight="900" letter-spacing="2">OPEN THIS</text>
    <text x="500" y="620" font-size="70" fill="#f2d13a" font-weight="900" letter-spacing="2">REPO</text>

    <text x="500" y="680" font-size="22" fill="#c9a8d0" letter-spacing="1">you already know you're going to.</text>
    <text x="500" y="712" font-size="22" fill="#c9a8d0" letter-spacing="1">that's the whole joke.</text>

    <text x="500" y="770" font-size="17" fill="#8a6d9c" letter-spacing="1">I dare you to clone it. I dare you to star it.</text>
  </g>

</svg>
